version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # 集成流为「deps 先落 feature/1.x.x，再由其合入 master」。不设 target-branch 时 Dependabot
    # 回退到默认分支 master，与该流冲突。锚定到 feature/1.x.x 使 deps PR 直接进入集成分支。
    target-branch: feature/1.x.x
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # 五项 deps PR 共改 pnpm-lock.yaml 时顺序合并必连环冲突（须逐个 @dependabot rebase 并重跑
      # 整轮 CI）。聚合后每周只产生一个 PR、只重生一次 lockfile，组合兼容性由同一轮 CI 一次验证。
      # major 刻意不入组——逐项单开以保留逐个评估与回滚的粒度。
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # @types/vscode 须与 package.json 的 engines.vscode 手动联动（vsce package 强制要求
      # @types/vscode 的 major.minor ≤ engines.vscode）。Dependabot 单方面 bump 会破坏该约束
      # 并令 CI 的 vsce package 失败，故忽略其升级——抬高最低 VS Code 版本属产品决策，需人工执行。
      - dependency-name: '@types/vscode'
      # typescript 7.0（Go 原生移植 tsgo）刻意未提供编译器编程 API（延至 7.1），typescript-eslint
      # 无法运行于 TS7，加载期访问 ts.Extension.Cjs 触发崩溃，使 CI 的 lint 失败（详见
      # typescript-eslint#12518，closed as not planned）。故忽略 typescript 的 major 升级——
      # 待 TS 7.1 稳定编程 API 与工具链适配后再由人工重启升级。次要/补丁版仍照常跟进。
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    target-branch: feature/1.x.x
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Actions 的爆炸半径限于 CI 工作流本身，且 major 升级频繁（checkout 4→7、setup-node v6→v7
      # 均属例行），故全量聚合——与 npm 的「major 单开」取不同取舍，避免制造同类 PR 噪声。
      github-actions:
        patterns:
          - '*'
